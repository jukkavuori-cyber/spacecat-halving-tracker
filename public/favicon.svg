<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="g" cx="50%" cy="40%" r="65%">
      <stop offset="0%"  stop-color="#7028e8"/>
      <stop offset="100%" stop-color="#1a0838"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#ffd35a"/>
      <stop offset="100%" stop-color="#d68a18"/>
    </linearGradient>
  </defs>

  <!-- Cosmic disc -->
  <circle cx="32" cy="32" r="30" fill="url(#g)"/>
  <!-- Cyan rim -->
  <circle cx="32" cy="32" r="30" fill="none" stroke="#40c8e0" stroke-width="2"/>

  <!-- BOLD cat ears (silhouette - readable at 16px) -->
  <path d="M16 22 L23 6  L30 22 Z" fill="#0a0a1a" stroke="#40c8e0" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M48 22 L41 6  L34 22 Z" fill="#0a0a1a" stroke="#40c8e0" stroke-width="1.4" stroke-linejoin="round"/>

  <!-- Big bold ₿ - the universal Bitcoin mark -->
  <circle cx="32" cy="36" r="16" fill="url(#gold)" stroke="#0a0a1a" stroke-width="1.6"/>
  <text x="32" y="45" text-anchor="middle"
        font-family="'Arial Black', Arial, Helvetica, sans-serif"
        font-weight="900" font-size="22" fill="#0a0a1a">₿</text>
</svg>
