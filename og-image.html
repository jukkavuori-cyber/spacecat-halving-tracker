<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1200px; height: 630px; overflow: hidden;
    background: #02020e;
    font-family: 'Space Mono', monospace;
    color: #e8e8ff;
    position: relative;
  }

  .glow-l {
    position: absolute; left: -100px; top: -100px;
    width: 560px; height: 560px; border-radius: 50%;
    background: radial-gradient(circle, rgba(100,40,220,0.38) 0%, transparent 65%);
  }
  .glow-r {
    position: absolute; right: -80px; bottom: -80px;
    width: 480px; height: 480px; border-radius: 50%;
    background: radial-gradient(circle, rgba(20,160,200,0.30) 0%, transparent 65%);
  }

  /* dot-grid overlay */
  .dots {
    position: absolute; inset: 0;
    background-image: radial-gradient(rgba(255,255,255,.09) 1px, transparent 1px);
    background-size: 32px 32px;
  }

  /* stars */
  .stars {
    position: absolute; inset: 0; pointer-events: none;
    background:
      radial-gradient(1.5px 1.5px at  95px  55px, #fff 0%, transparent 100%),
      radial-gradient(1px   1px   at 210px 130px, #aaddff 0%, transparent 100%),
      radial-gradient(1px   1px   at 395px  38px, #fff 0%, transparent 100%),
      radial-gradient(2px   2px   at 530px  95px, #fff 0%, transparent 100%),
      radial-gradient(1px   1px   at 710px  42px, #aaddff 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 870px  75px, #fff 0%, transparent 100%),
      radial-gradient(1px   1px   at 1010px 35px, #fff 0%, transparent 100%),
      radial-gradient(1px   1px   at 1120px 115px, #aaddff 0%, transparent 100%),
      radial-gradient(1px   1px   at  65px 210px, #fff 0%, transparent 100%),
      radial-gradient(1px   1px   at 170px 320px, #aaddff 0%, transparent 100%),
      radial-gradient(1px   1px   at 960px 210px, #fff 0%, transparent 100%),
      radial-gradient(1px   1px   at 1060px 410px, #aaddff 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 1160px 310px, #fff 0%, transparent 100%),
      radial-gradient(1px   1px   at  45px 570px, #aaddff 0%, transparent 100%),
      radial-gradient(1px   1px   at 820px 545px, #fff 0%, transparent 100%);
  }

  .scan {
    position: absolute; inset: 0;
    background: repeating-linear-gradient(
      to bottom, transparent 0px, transparent 3px,
      rgba(0,0,0,.05) 3px, rgba(0,0,0,.05) 4px
    );
  }

  /* border frame */
  .frame {
    position: absolute; inset: 0;
    border: 1px solid rgba(120,60,255,0.18);
  }
  .frame::before {
    content: '';
    position: absolute; inset: 8px;
    border: 1px solid rgba(120,60,255,0.08);
  }

  .content {
    position: absolute;
    inset: 0;
    z-index: 2;
    padding: 52px 70px 48px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  /* ── TOP ── */
  .top-row { display: flex; align-items: center; justify-content: space-between; }

  .logo { display: flex; align-items: center; gap: 16px; }
  .cat-icon {
    font-size: 56px;
    filter: drop-shadow(0 0 16px rgba(140,80,255,0.9))
            drop-shadow(0 0 36px rgba(140,80,255,0.4));
  }
  .logo-text {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900; font-size: 36px; letter-spacing: .14em;
    background: linear-gradient(100deg, #a066ff, #40c8e0);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .logo-sub {
    font-size: 11px; letter-spacing: .22em; color: #556;
    margin-top: 4px; text-transform: uppercase;
  }

  .live-badge {
    display: flex; align-items: center; gap: 8px;
    border: 1px solid rgba(80,220,120,0.40);
    background: rgba(80,220,120,0.08);
    padding: 8px 20px;
    font-size: 12px; letter-spacing: .2em; color: #50dc78;
  }
  .ldot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #50dc78; box-shadow: 0 0 8px #50dc78;
  }

  /* ── HEADLINE ── */
  .headline {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900; font-size: 76px; line-height: 1.05;
    letter-spacing: .03em; color: #f0f0ff;
  }
  .headline .gold {
    background: linear-gradient(100deg, #f0c030, #e08020);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  /* ── STAT CARDS ── */
  .stats-row { display: flex; gap: 16px; }
  .scard {
    flex: 1;
    background: rgba(20,10,40,0.70);
    border: 1px solid rgba(120,60,255,0.20);
    padding: 16px 20px 16px 22px;
    position: relative;
  }
  .scard::before {
    content: ''; position: absolute; top: 0; left: 0;
    width: 3px; height: 100%;
    background: #a066ff; box-shadow: 0 0 8px #a066ff;
  }
  .scard.gold::before { background: #e0a020; box-shadow: 0 0 8px #e0a020; }
  .scard.cyan::before { background: #40c8e0; box-shadow: 0 0 8px #40c8e0; }
  .scard.green::before { background: #50dc78; box-shadow: 0 0 8px #50dc78; }

  .sl { font-size: 10px; letter-spacing: .18em; color: #556; text-transform: uppercase; margin-bottom: 7px; }
  .sv {
    font-family: 'Orbitron', sans-serif;
    font-size: 24px; font-weight: 700; color: #a066ff;
  }
  .scard.gold .sv { color: #e0a020; }
  .scard.cyan .sv { color: #40c8e0; }
  .scard.green .sv { color: #50dc78; }

  /* ── BOTTOM ── */
  .bottom-row { display: flex; align-items: center; justify-content: space-between; }
  .url {
    font-family: 'Orbitron', sans-serif;
    font-size: 18px; letter-spacing: .1em; color: #445;
  }
  .url b { color: #a066ff; }
  .tagline {
    font-size: 12px; letter-spacing: .18em;
    color: #334; text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="glow-l"></div>
  <div class="glow-r"></div>
  <div class="dots"></div>
  <div class="stars"></div>
  <div class="scan"></div>
  <div class="frame"></div>

  <div class="content">
    <div class="top-row">
      <div class="logo">
        <div class="cat-icon">🐱</div>
        <div>
          <div class="logo-text">SPACECAT</div>
          <div class="logo-sub">Bitcoin Halving Tracker</div>
        </div>
      </div>
      <div class="live-badge"><div class="ldot"></div>LIVE DATA</div>
    </div>

    <div class="headline">
      Next Bitcoin Halving<br/>
      <span class="gold">Block 1,050,000</span>
    </div>

    <div class="stats-row">
      <div class="scard">
        <div class="sl">Current Block</div>
        <div class="sv">948,000+</div>
      </div>
      <div class="scard gold">
        <div class="sl">Block Reward</div>
        <div class="sv">3.125 BTC</div>
      </div>
      <div class="scard cyan">
        <div class="sl">Est. Days Left</div>
        <div class="sv">~700 days</div>
      </div>
      <div class="scard green">
        <div class="sl">Cycle Progress</div>
        <div class="sv">~51%</div>
      </div>
    </div>

    <div class="bottom-row">
      <div class="url"><b>spacecat</b>.academy</div>
      <div class="tagline">Real-time · Live blocks · BTC Price History</div>
    </div>
  </div>
</body>
</html>
